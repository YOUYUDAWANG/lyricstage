<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LyricStage</title>
    <link rel="stylesheet" href="/src/popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="popup-brand"><span class="mark">LS</span><div><strong>LyricStage</strong><small>歌词舞台</small></div></div>
        <div class="header-actions">
          <span class="connection-chip"><b data-dot></b><span data-status>正在检查</span></span>
          <button class="plain-icon-button" type="button" data-open-settings title="打开设置" aria-label="打开设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
          </button>
        </div>
      </header>

      <section class="now-playing">
        <span class="section-label">正在播放</span>
        <p data-title>先播放一首歌曲</p>
        <small data-artist>再打开 YouTube Music 歌词</small>
      </section>

      <div class="launch-actions">
        <button class="primary" type="button" data-open-stage><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z"/></svg>打开歌词舞台</button>
        <button class="icon-button" type="button" data-open-source title="打开 YouTube Music" aria-label="打开 YouTube Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8"/><path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
      </div>

      <p class="popup-notice" data-popup-notice role="status" aria-live="polite" aria-atomic="true"></p>

      <section class="quick-panel">
        <header><h2>快捷演出</h2><button type="button" data-open-settings-section="performance">更多</button></header>
        <label class="quick-toggle">
          <span><strong>轻量模式</strong><small>减少模糊与动态效果</small></span>
          <input type="checkbox" data-lightweight-toggle />
        </label>
        <label class="quick-toggle">
          <span><strong>个人 VJ</strong><small>增强全屏环境运动</small></span>
          <input type="checkbox" data-vj-toggle />
        </label>
      </section>

      <section class="config-panel">
        <button type="button" data-open-settings-section="lyrics">
          <span><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l9-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="15" cy="16" r="3"/></svg></i><span><strong>歌词源</strong><small data-lyrics-summary>LRCLIB · 酷狗</small></span></span><b>›</b>
        </button>
        <button type="button" data-open-settings-section="director">
          <span><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="3.2"/></svg></i><span><strong>AI 歌词匹配</strong><small data-director-summary>本地清洗优先</small></span></span><b>›</b>
        </button>
      </section>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>

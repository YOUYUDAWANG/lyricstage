<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LyricStage</title>
    <link rel="stylesheet" href="/src/popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="mark">LS</span>
        <div><b data-dot></b><span data-status>正在检查</span></div>
      </header>
      <section>
        <p data-title>先播放一首歌曲</p>
        <span data-artist>再打开 YouTube Music 歌词</span>
      </section>
      <button class="primary" type="button" data-open-stage>打开 YouTube Music 歌词</button>
      <button type="button" data-open-source>打开 YouTube Music</button>
      <dl class="config-status">
        <div>
          <dt>歌词源</dt>
          <dd data-lyrics-summary>LRCLIB · 酷狗</dd>
        </div>
        <div>
          <dt>AI 导演</dt>
          <dd data-director-summary>本地确定性演出</dd>
        </div>
      </dl>
      <button type="button" data-open-settings>打开设置</button>
      <footer>音频不上传 · 导演会发送曲目元数据、歌词正文/时序与本地 MusicMap</footer>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
